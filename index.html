<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101216"><meta name="description" content="张昱辰·重启人生计划：90天身体、精神、饮食与习惯重建。"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>张昱辰 · 重启人生</title><style>

ansform:scale(.99)}.btnrow{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}.nav{position:fixed;bottom:0;left:0;right:0;background:#181b20f5;border-top:1px solid #3c3f45;display:flex;justify-content:center;z-index:20;padding:8px 4px max(10px,env(safe-area-inset-bottom))}.nav button{flex:1;max-width:145px;border:0;background:none;color:#a7a7a7;font-size:11px;padding:5px 0}.nav button b{display:block;font-size:21px;font-weight:500;margin-bottom:3px}.nav button.active{color:var(--gold)}.hidden{display:none}.check{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid #34373d}.check input{width:19px;height:19px;accent-color:var(--gold)}.check span{flex:1}.muted{color:var(--muted)}.notice{border-left:3px solid var(--gold);background:#29251f;padding:12px;border-radius:8px;font-size:13px;line-height:1.7}.alert{border-left-color:var(--red);background:#352626}.log{border-top:1px solid var(--line);padding:10px 0;font-size:13px}.pill{display:inline-block;border-radius:20px;padding:4px 9px;background:#35383e;color:#d5d4d1;font-size:11px;margin:3px 4px 3px 0}.daybar{display:flex;gap:5px;overflow:auto;padding:8px 0}.daybar button{flex:1;min-width:39px;background:#292c33;color:#c4c4c4;border:1px solid #42454b;border-radius:10px;padding:10px 2px}.daybar button.sel{border-color:var(--gold);color:var(--gold)}.section-intro{color:#b6b7b8;font-size:13px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.row input{flex:1}.stat{font-size:22px;color:var(--gold);font-weight:700}.fine{font-size:11px;color:var(--muted)}.quote{font-style:italic;color:#c9bda8}.barline{display:flex;align-items:center;gap:8px;font-size:12px;margin:9px 0}.barline span{width:39px;color:var(--muted)}.barline div{flex:1;background:#30333a;height:9px;border-radius:10px;overflow:hidden}.barline i{display:block;height:100%;background:var(--gold);border-radius:10px}.barline strong{width:47px;text-align:right}button:focus-visible,input:focus-visible,select:focus-visible{outline:2 'use strict';const KEY='zychen-restart-v1';const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const shift=(str,n)=>{let d=new Date(str+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const dayDiff=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/86400000);const initial=()=>({start:today(),checks:{},workouts:[],english:[],journals:[],meals:{},alcohol:[],doctorReviewed:false,doctorPlan:'',prefs:{},lastSaved:today()});let data;try{data=Object.assign(initial(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){data=initial()}const save=()=>{data.lastSaved=today();try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('保存失败：设备存储空间可能不足，请先导出备份。')}};let tab='home',mealDay=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const el=id=>document.getElementById(id);const dayIndex=Math.max(1,Math.min(90,dayDiff(today(),data.start)+1));const tasks=[['exercise','运动或舒展身体'],['english','学习英语20分钟'],['food','吃好三餐'],['freedom','记录饮酒和身体状态']];const checked=(date,key)=>!!data.checks[date]?.[key];const totalDone=()=>Object.values(data.checks).reduce((a,o)=>a+Object.values(o).filter(Boolean).length,0);const menus=[
[['燕麦牛奶＋鸡蛋＋水果','清蒸鱼＋西兰花＋杂粮饭','番茄豆腐汤＋红薯'],['全麦吐司＋鸡蛋＋豆浆','鸡胸肉＋彩椒＋米饭','虾仁蒸蛋＋黄瓜＋玉米'],['酸奶＋燕麦＋核桃','香菇鸡肉＋油菜＋米饭','白菜豆腐煲＋馒头'],['南瓜＋鸡蛋＋牛奶','番茄炒蛋＋青菜＋杂粮饭','冬瓜虾仁汤＋玉米'],['燕麦粥＋香蕉＋鸡蛋','青花鱼＋西兰花＋米饭','菌菇豆腐汤＋紫薯'],['全麦面包＋酸奶＋苹果','彩椒牛肉＋青菜＋米饭','虾仁豆腐＋红薯'],['小米粥＋鸡蛋＋猕猴桃','清蒸鱼＋香菇青菜＋米饭','番茄鸡蛋面＋菠菜']],
[['玉米＋牛奶＋鸡蛋','香煎鸡腿肉＋芦笋＋杂粮饭','冬瓜豆腐汤＋红薯'],['燕麦酸奶＋苹果','清蒸鱼＋胡萝卜＋米饭','西红柿鸡蛋汤＋全麦馒头'],['全麦吐司＋鸡蛋','虾仁炒西兰花＋米饭','香菇青菜豆腐煲＋玉米'],['南瓜粥＋坚果','牛肉炒芹菜＋杂粮饭','紫菜虾皮豆腐汤＋红薯'],['酸奶＋燕麦＋蓝莓','鸡胸肉＋菜花＋米饭','番茄菌菇面'],['鸡蛋＋豆浆＋全麦馒头','清蒸青花鱼＋菠菜＋米饭','白菜炖豆腐＋南瓜'],['小米粥＋苹果＋鸡蛋','虾仁蒸蛋＋青菜＋米饭','鸡肉菌菇汤＋玉米']],
[['燕麦＋牛奶＋香蕉','清蒸鲈鱼＋油菜＋米饭','菠菜豆腐汤＋紫薯'],['全麦吐司＋鸡蛋＋苹果','香菇鸡胸肉＋西兰花＋杂粮饭','番茄鸡蛋面'],['酸奶＋核桃＋水果','虾仁豆腐＋彩椒＋米饭','冬瓜汤＋玉米＋鸡蛋'],['蒸南瓜＋豆浆＋鸡蛋','牛肉炒青菜＋米饭','白菜香菇豆腐煲＋馒头'],['小米粥＋鸡蛋＋猕猴桃','青花鱼＋芦笋＋米饭','菌菇鸡汤＋红薯'],['全麦面包＋牛奶＋水果','番茄炒蛋＋虾仁＋米饭','西兰花豆腐汤＋玉米'],['燕麦酸奶＋苹果','鸡肉炒彩椒＋杂粮饭','蔬菜鸡蛋面']]];
const recipes=['清蒸鱼：鱼加姜片，水开后蒸至熟透；出锅淋少量生抽。','鸡胸肉：切片加少量盐腌制，用少油平底锅煎至熟透。','虾仁蒸蛋：蛋液加温水搅匀，放入虾仁蒸至凝固熟透。','豆腐汤：蔬菜煮软后加入豆腐，少盐调味。','杂粮饭：大米混合适量糙米，按电饭锅说明煮熟。'];const vocab=[['resilient','有韧性的','I am becoming more resilient.'],['progress','进步','Small progress still matters.'],['curious','好奇的','Stay curious about the world.'],['balance','平衡','I want more balance in my life.'],['focus','专注','I will focus on one thing.'],['habit','习惯','A habit grows through practice.'],['freedom','自由','I am building my own freedom.']];
function setTab(t){tab=t;render();window.scrollTo(0,0)}function toggleTask(k){data.checks[today()]??={};data.checks[today()][k]=!checked(today(),k);save();render()}function renderNav(){el('nav').innerHTML=[['home','⌂','首页'],['body','◈','身体'],['mind','✦','精神'],['food','♨','饮食'],['freedom','◇','自由']].map(([id,ic,label])=>`<button class="${tab===id?'active':''}" onclick="setTab('${id}')"><b>${ic}</b>${label}</button>`).join('')}
function home(){let n=tasks.filter(t=>checked(today(),t[0])).length;return `<section class="card hero"><div class="flex"><div><div class="eyebrow">90 DAY RESTART</div><h2>第 ${dayIndex} 天 · 继续向前</h2><div class="sub">起始日 ${esc(data.start)} · 今日 ${today()}</div></div><span class="tag">${Math.round(dayIndex/90*100)}%</span></div><div class="track"><div style="width:${dayIndex/90*100}%"></div></div><p class="quote">你不必一下子改变全部，只需要继续向前。</p></section><div class="grid"><div class="tile"><div class="small">今日完成</div><div class="stat">${n}/4</div></div><div class="tile"><div class="small">累计打卡</div><div class="stat">${totalDone()}</div></div><div class="tile"><div class="small">运动记录</div><div class="stat">${data.workouts.length}</div></div><div class="tile"><div class="small">成长记录</div><div class="stat">${data.english.length+data.journals.length}</div></div></div><section class="card"><h2>今日四件小事</h2>${tasks.map(([k,v])=>`<label class="check"><input type="checkbox" ${checked(today(),k)?'checked':''} onchange="toggleTask('${k}')"><span>${v}</span></label>`).join('')}<p class="small">打卡不等于完成全部任务；根据身体状态调整。今天没做到，也不用补打。</p></section><section class="card"><h2>我的90天</h2><p class="section-intro">每30天一个阶段：先观察与建立习惯，再稳定执行，最后回顾调整。所有数据只保存在当前设备。</p><div class="btnrow"><button class="btn secondary" onclick="setTab('body')">开始运动</button><button class="btn secondary" onclick="setTab('mind')">开始学习</button><button class="btn secondary" onclick="setTab('freedom')">习惯记录</button></div></section><section class="card"><h2>每日成长日记</h2><label>今天值得记住的一件事</label><textarea id="journalText" placeholder="哪怕只是好好吃了一顿饭，也值得记下来。"></textarea><div class="btnrow"><button class="btn" onclick="addJournal()">保存日记</button><button class="btn secondary" onclick="setTab('settings')">设置与备份</button></div>${data.journals.slice(-3).reverse().map(j=>`<div class="log"><span class="small">${esc(j.date)}</span><p>${esc(j.text)}</p></div>`).join('')}</section>`}
function addJournal(){let t=el('journalText').value.trim();if(!t)return alert('写一点今天的感受吧');data.journals.push({date:today(),text:t});save();render()}
function body(){return `<section class="card"><div class="eyebrow">BODY RESET</div><h2>身体重塑</h2><p class="section-intro">目标：全身更紧致、力量更好，而不是盲目减重。初期建议每周3次循序渐进的力量训练。</p><div class="notice">近期有反复头晕时，先评估原因；头晕当下不要进行器械或高强度训练。运动出现胸痛、晕厥等情况应立即就医。</div></section><section class="card"><h2>新手训练参考</h2>${[['A · 下肢与核心','热身5–10分钟；徒手深蹲、臀桥、轻重量腿推、鸟狗式；每项1–2组，按能力调整。'],['B · 上肢与体态','热身；坐姿划船、胸推、轻哑铃肩部动作、死虫式；每项1–2组。'],['C · 全身综合','热身；坐站训练、轻重量硬拉模式、下拉、侧平板；每项1–2组。']].map(([a,b])=>`<div class="tile" style="margin:9px 0"><b>${a}</b><p class="small">${b}</p></div>`).join('')}<p class="fine">动作以无痛、可控为原则，初次使用器械可请健身房教练指导；训练日之间留恢复时间。</p></section><section class="card"><h2>记录一次运动</h2><label>运动类型</label><select id="wtype"><option>力量训练</option><option>散步</option><option>拉伸</option><option>骑行</option><option>其他</option></select><label>时长（分钟）</label><input id="wmin" type="number" min="1" max="600" placeholder="例如 30"><label>感受</label><input id="wnote" maxlength="200" placeholder="例如：今天动作更稳了"><div class="btnrow"><button class="btn" onclick="addWorkout()">保存运动</button></div>${data.workouts.slice(-6).reverse().map(w=>`<div class="log">${esc(w.date)} · ${esc(w.type)} · ${w.min}分钟 <span class="muted">${esc(w.note)}</span></div>`).join('')}</section>`}
function addWorkout(){let n=Number(el('wmin').value);if(!Number.isFinite(n)||n<1||n>600)return alert('请输入1到600之间的运动分钟数');data.workouts.push({date:today(),type:el('wtype').value,min:n,note:el('wnote').value.trim()});save();render()}

function speakEnglish(text){
  if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){
    alert('当前浏览器不支持语音朗读，请更新 Chrome 后重试');return;
  }
  try{
    window.speechSynthesis.cancel();
    const utterance=new SpeechSynthesisUtterance(text);
    utterance.lang='en-US';
    utterance.rate=1;
    window.speechSynthesis.speak(utterance);
  }catch(err){alert('朗读暂时不可用，请检查手机的文字转语音设置');}
}

function mind(){const v=vocab[Math.abs(dayDiff(today(),data.start))%vocab.length];return `<section class="card"><div class="eyebrow">MIND RESET</div><h2>精神丰盈</h2><p class="section-intro">英语是起点，阅读、思考、好奇心也是成长的一部分。</p></section><section class="card hero"><span class="tag">今日英语</span><h2 style="font-size:27px;color:var(--gold)">${v[0]} <button type="button" class="speak-btn" onclick="speakEnglish(vocab[Math.abs(dayDiff(today(),data.start))%vocab.length][0])" aria-label="朗读英文单词" title="朗读单词">🔊 朗读</button></h2><p>${v[1]}</p><p class="quote">${v[2]} <button type="button" class="speak-btn" onclick="speakEnglish(vocab[Math.abs(dayDiff(today(),data.start))%vocab.length][2])" aria-label="朗读英文句子" title="朗读句子">🔊 朗读</button></p><p class="small">建议：朗读3遍，自己再造一个句子。</p></section><section class="card"><h2>今日学习记录</h2><label>学习类型</label><select id="etype"><option>英语</option><option>阅读</option><option>纪录片</option><option>思维训练</option><option>其他</option></select><label>学习分钟数</label><input id="emin" type="number" min="1" max="600" placeholder="例如 20"><label>今天学到了什么？</label><textarea id="enote" placeholder="一个新词、一句话、一个观点……"></textarea><div class="btnrow"><button class="btn" onclick="addEnglish()">保存学习</button></div>${data.english.slice(-5).reverse().map(x=>`<div class="log">${esc(x.date)} · ${esc(x.type)} · ${x.min}分钟<br><span class="muted">${esc(x.note)}</span></div>`).join('')}</section><section class="card"><h2>每日思考</h2><p>如果今天只允许你改变一个习惯，你会选什么？为什么？</p><p class="small">把答案写进首页的成长日记。精神世界的丰富，不需要一次完成。</p></section>`}
function addEnglish(){let n=Number(el('emin').value);if(!Number.isFinite(n)||n<1||n>600)return alert('请输入1到600之间的学习分钟数');data.english.push({date:today(),type:el('etype').value,min:n,note:el('enote').value.trim()});save();render()}
function food(){const week=Math.max(0,Math.floor(dayDiff(today(),data.start)/7));const meal=menus[week%menus.length][mealDay];const d=['周一','周二','周三','周四','周五','周六','周日'];return `<section class="card"><div class="eyebrow">FOOD RESET</div><h2>健康饮食 · 双人版</h2><p class="section-intro">正常吃主食、蛋白质和蔬菜；清淡不等于水煮或挨饿。菜单按计划起始日每7天轮换，共3套参考周菜单循环。</p><span class="tag">第 ${week+1} 周</span><div class="daybar">${d.map((x,i)=>`<button class="${i===mealDay?'sel':''}" onclick="mealDay=${i};render()">${x.slice(1)}</button>`).join('')}</div>${['早餐','午餐','晚餐'].map((name,i)=>`<div class="tile" style="margin:9px 0"><div class="small">${name} · 2人份</div><h3>${esc(meal[i])}</h3><label class="check"><input type="checkbox" ${data.meals[`${week}-${mealDay}-${i}`]?'checked':''} onchange="toggleMeal('${week}-${mealDay}-${i}')"><span>今天吃好了</span></label></div>`).join('')}</section><section class="card"><h2>简单做法参考</h2>${recipes.map(x=>`<p class="small">• ${x}</p>`).join('')}<p class="fine">食材数量根据两人的实际食量调整，鱼肉、禽肉需彻底煮熟；有过敏或特殊饮食需求时自行替换。</p></section><section class="card"><h2>采购建议</h2><p>两人份一周：鸡蛋约12–16个、鱼2–3餐、禽肉2–3餐、虾1–2餐、豆腐2–3盒、各类蔬菜约每天足量搭配、米面燕麦薯类及水果按食量采购。</p><button class="btn secondary" onclick="copyText('双人一周采购建议：鸡蛋12–16个；鱼2–3餐；禽肉2–3餐；虾1–2餐；豆腐2–3盒；蔬菜水果；米面燕麦薯类；牛奶或无糖酸奶。按实际食量调整。')">复制采购建议</button></section>`}
function toggleMeal(k){data.meals[k]=!data.meals[k];save();render()}function copyText(t){navigator.clipboard?.writeText(t).then(()=>alert('已复制')).catch(()=>alert(t))}
function alcoholGrams(v,abv){return v*abv/100*.789}function freedom(){const recent=data.alcohol.slice(-7).reverse();const current=data.alcohol.filter(x=>dayDiff(today(),x.date)>=0&&dayDiff(today(),x.date)<7);const grams=current.reduce((a,x)=>a+x.grams,0);return `<section class="card"><div class="eyebrow">FREEDOM RESET</div><h2>自由计划 · 饮酒习惯</h2><p class="section-intro">不评判，不清零。先记录真实情况，观察诱因和身体变化，再与医生一起决定安全的改变方式。</p><div class="notice alert"><b>戒断安全提醒</b><br>长期几乎每天饮酒的人，突然停酒或快速减量可能引发戒断。即使以前停酒一周没有症状，也不能保证今后完全安全。建议先由医生评估，不要自行制定快速减酒方案。<br>减酒或停酒后如出现手抖、异常出汗、明显心慌、持续呕吐，请及时就医；如出现抽搐、幻觉或意识混乱，请立即急诊。不要自行用镇静药、安眠药或更多酒处理症状。</div></section><div class="grid"><div class="tile"><div class="small">近7天已记录纯酒精</div><div class="stat">${grams.toFixed(0)}g</div></div><div class="tile"><div class="small">近7天记录次数</div><div class="stat">${current.length}</div></div></div><section class="card"><h2>今日饮酒记录</h2><p class="small">不喝酒也可填0mL；未记录不等于没喝。</p><label>日期</label><input id="adate" type="date" value="${today()}" max="${today()}"><label>啤酒等饮品总量（mL）</label><input id="avol" type="number" min="0" max="20000" placeholder="例如 1500"><label>酒精度（%）</label><input id="aabv" type="number" min="0" max="100" step="0.1" value="5"><label>想喝酒的主要原因</label><select id="areason"><option>习惯性想喝</option><option>焦虑或压力</option><option>喜欢喝酒的感觉</option><option>聚会或社交</option><option>今天没有饮酒</option><option>其他</option></select><label>身体状态（可选）</label><select id="asym"><option>没有明显不适</option><option>头晕</option><option>心慌</option><option>手抖或异常出汗</option><option>恶心或呕吐</option><option>严重不适 / 其他</option></select><label>补充记录</label><input id="anote" maxlength="200" placeholder="睡眠、情绪、喝酒时间……"><div class="btnrow"><button class="btn" onclick="addAlcohol()">保存记录</button></div></section><section class="card"><h2>近期趋势</h2>${recent.length?recent.map(x=>`<div class="barline"><span>${esc(x.date.slice(5))}</span><div><i style="width:${Math.min(100,x.grams/100*100)}%"></i></div><strong>${x.grams.toFixed(0)}g</strong></div>`).join(''):'<p class="small">暂无记录。记录几天后可查看变化。</p>'}<p class="fine">条形图以100g为满格作视觉参考，不代表安全阈值；多次记录按条显示。</p></section><section class="card"><h2>医疗评估与安全计划</h2><label class="check"><input type="checkbox" ${data.doctorReviewed?'checked':''} onchange="data.doctorReviewed=this.checked;save();render()"><span>我已和医生讨论饮酒及戒断风险</span></label><label>医生建议 / 支持资源（仅自己可见）</label><textarea id="doctorPlan" placeholder="就诊日期、医生建议、求助联系人……">${esc(data.doctorPlan||'')}</textarea><button class="btn secondary" onclick="data.doctorPlan=el('doctorPlan').value;save();alert('已保存在当前设备')">保存安全计划</button><p class="small">如果喝酒冲动很强，可以先记录当时情绪、离开诱发情境、联系信任的人；但这些方法不能替代戒断的医疗处理。</p></section>`}
function addAlcohol(){const date=el('adate').value,v=Number(el('avol').value),a=Number(el('aabv').value);if(!date||date>today()||!Number.isFinite(v)||v<0||v>20000||el('avol').value.trim()===''||!Number.isFinite(a)||a<0||a>100)return alert('请填写有效日期、饮酒量和酒精度');let symptom=el('asym').value;data.alcohol.push({date,volume:v,abv:a,grams:alcoholGrams(v,a),reason:el('areason').value,symptom,note:el('anote').value.trim()});save();if(symptom==='手抖或异常出汗'||symptom==='恶心或呕吐'||symptom==='严重不适 / 其他')alert('已记录。若症状发生在减酒或停酒后，请及时就医评估；出现抽搐、幻觉或意识混乱，请立即急诊。');render()}
function settings(){return `<section class="card"><div class="eyebrow">PRIVATE & LOCAL</div><h2>设置与数据备份</h2><p class="small">你的记录默认只存在此设备当前浏览器的本地存储中。清理浏览器数据、卸载应用或换手机可能导致丢失；公开GitHub仓库只放程序文件，不上传你的个人记录。</p><label>90天计划开始日期</label><input type="date" id="startDate" value="${esc(data.start)}"><div class="btnrow"><button class="btn secondary" onclick="changeStart()">保存起始日</button></div><h3>备份和迁移</h3><div class="btnrow"><button class="btn" onclick="exportData()">导出私人记录 JSON</button><label class="btn secondary" style="margin:0">导入备份<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"></label></div><p class="fine">导出的备份包含饮酒等敏感记录，请保管好，不要上传到公开仓库。</p><h3>管理记录</h3><div class="btnrow"><button class="btn secondary danger" onclick="resetData()">清空本机所有记录</button></div></section><section class="card"><h2>使用说明</h2><p class="small">APP无需注册或服务器。首次联网打开后可离线访问已缓存页面。新版本发布后，联网重新打开可能需要等待缓存更新。提醒功能仅在你打开APP时展示，不会在后台发送医疗警报。</p><p class="small">健康和训练内容为一般性参考，不是诊断或个体化医疗方案。</p></section>`}
function changeStart(){let s=el('startDate').value;if(!s)return alert('请选择计划开始日期');if(!confirm('修改开始日期会改变90天进度及食谱轮换周期，确定吗？'))return;data.start=s;save();render()}function exportData(){const b=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`重启人生私人备份_${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(inp){let f=inp.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj.data||!Array.isArray(obj.data.alcohol)||!Array.isArray(obj.data.workouts)||!obj.data.start)throw Error('文件格式不符合要求');if(!confirm('导入会覆盖当前设备的所有记录，确定吗？'))return;data=Object.assign(initial(),obj.data);save();render();alert('导入成功')}catch(e){alert('无法导入：'+e.message)}}function resetData(){if(confirm('确定永久清空本机全部记录吗？请先导出备份。')&&confirm('最后确认：清空后无法撤销。')){data=initial();save();tab='home';render()}}
function render(){renderNav();el('app').innerHTML=({home,body,mind,food,freedom,settings}[tab]||home)()}render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
